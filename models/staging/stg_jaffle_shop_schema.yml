version: 2

models:
  - name : stg_jaffle_shop__customers
    description : one customer per row
    columns:
      - name : customer_id
        data_tests :
          - unique
          - not_null
  - name : stg_jaffle_shop__orders
    description : unique order id
    columns:
      - name : customer_id
        description: order is unique
        data_tests :
          - unique
          - not_null
      - name : status
        description: "{{ doc('order_status') }}"
        data_tests :
          - accepted_values:
              values: [ 'Completed','InTransit' ]
                
                       